name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and mod_version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Release workflow must run on a v* tag ref (got '${GITHUB_REF}'). Push or select a v* tag to release."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          MOD_VERSION="$(grep -E '^mod_version=' gradle.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]\r')"

          if [[ -z "${MOD_VERSION}" ]]; then
            echo "::error::Could not read mod_version from gradle.properties."
            exit 1
          fi

          if [[ "${TAG_VERSION}" != "${MOD_VERSION}" ]]; then
            echo "::error::Tag version '${TAG_VERSION}' (from '${TAG_NAME}') does not match mod_version '${MOD_VERSION}' in gradle.properties."
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "${TAG_VERSION}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "version=${MOD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build and test mod
        run: ./gradlew test build --no-daemon

      - name: Verify expected release artifacts
        shell: bash
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAIN_JAR="build/libs/archica-mcp-${MOD_VERSION}.jar"
          SOURCES_JAR="build/libs/archica-mcp-${MOD_VERSION}-sources.jar"
          if [[ ! -f "${MAIN_JAR}" || ! -f "${SOURCES_JAR}" ]]; then
            echo "::error::Expected release artifacts missing in build/libs/:"
            ls -la build/libs/ || true
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Archica MCP ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            build/libs/archica-mcp-${{ steps.version.outputs.version }}.jar
            build/libs/archica-mcp-${{ steps.version.outputs.version }}-sources.jar
